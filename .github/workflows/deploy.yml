# ===== GitHub Actions Workflow =====
# This pipeline:
# - Runs tests on ALL branches (main and dev)
# - Builds Docker & Deploys ONLY from main branch

name: Deploy Weather App to GitHub Pages

# Step 1: When should this pipeline run?
on:
  push:
    branches:
      - main  # Run full pipeline (test + docker + deploy)
      - dev   # Run tests only

# Step 2: Define permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Step 3: Define the jobs
jobs:
  # ===== JOB 1: Run Tests =====
  test:
    runs-on: ubuntu-latest

    steps:
      # Download our code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run the tests
      - name: Run tests
        run: npm test

  # ===== JOB 2: Build & Push Docker Image to Docker Hub =====
  # Only runs on MAIN branch (not on dev/feature branches)
  docker:
    needs: test  # Wait for tests to pass first!
    if: github.ref == 'refs/heads/main'  # <-- Only on main!
    runs-on: ubuntu-latest

    steps:
      # Download our code
      - name: Checkout code
        uses: actions/checkout@v4

      # Create config.js for the Docker image
      - name: Create config.js with API key
        run: |
          echo 'const CONFIG = { API_KEY: "${{ secrets.WEATHER_API_KEY }}" };' > config.js

      # Log in to Docker Hub (username is hardcoded, password from secret)
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "saranyad04" --password-stdin

      # Build the Docker image
      - name: Build Docker image
        run: docker build -t saranyad04/weather-app:latest .

      # Push the image to Docker Hub
      - name: Push to Docker Hub
        run: docker push saranyad04/weather-app:latest

  # ===== JOB 3: Deploy to GitHub Pages (only runs from main branch) =====
  deploy:
    needs: test  # Wait for test job to pass first!
    if: github.ref == 'refs/heads/main'  # <-- Only on main!

    # Use the GitHub Pages deployment environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Run on Ubuntu (Linux) server
    runs-on: ubuntu-latest

    steps:
      # Step 3a: Download our code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 3b: Create config.js from GitHub Secret
      # (config.js is not in the repo — we create it here using the secret)
      - name: Create config.js with API key
        run: |
          echo 'const CONFIG = { API_KEY: "${{ secrets.WEATHER_API_KEY }}" };' > config.js

      # Step 3c: Set up GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 3d: Upload our files to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."  # Upload everything in the repo

      # Step 3e: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
